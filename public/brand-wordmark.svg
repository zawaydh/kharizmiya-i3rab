<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="خوارزمية الإعراب">
  <defs>
    <linearGradient id="teal" x1="0" x2="1"><stop offset="0" stop-color="#39F0DE"/><stop offset="1" stop-color="#2FBCB0"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#FFF09A"/><stop offset="1" stop-color="#D9A92B"/></linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#123133" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="900" height="240" fill="none"/>
  <text filter="url(#softGlow)" x="450" y="95" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="72" font-weight="900">
    <tspan fill="url(#teal)">خوارزمية</tspan><tspan fill="url(#gold)"> الإعراب</tspan>
  </text>
  <line x1="170" y1="128" x2="392" y2="128" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <rect x="438" y="116" width="24" height="24" fill="url(#gold)" transform="rotate(45 450 128)"/>
  <line x1="508" y1="128" x2="730" y2="128" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <text x="450" y="180" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="32" font-weight="700" fill="#2F9E9E">مدرّب تفكير نحوي موجّه</text>
</svg>