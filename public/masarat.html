<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الدليل الخوارزمي التفاعلي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --stroke:#e6e8ee;
      --text:#111827;
      --muted:#6b7280;

      --green:#22c55e;
      --blue:#1d4ed8;
      --red:#ef4444;

      --shadow:0 10px 30px rgba(0,0,0,.08);
      --shadow2:0 6px 16px rgba(0,0,0,.06);
      --radius:18px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, Arial;
      background:var(--bg);
      color:var(--text);
    }

    /* ===== Header ===== */
    header{
      position:sticky; top:0; z-index:60;
      background:rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-bottom:1px solid var(--stroke);
    }
    .head{
      max-width:1100px;
      margin:auto;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:240px;
    }
    .logo{
      width:44px;height:44px;
      border-radius:14px;
      background:linear-gradient(135deg,var(--green),#9dffcd);
      display:grid; place-items:center;
      font-weight:900;
      color:#0b3b1d;
      box-shadow:var(--shadow2);
      flex:0 0 auto;
    }
    .brandTitle b{display:block;font-size:15px; font-weight:900}
    .brandTitle span{display:block;font-size:12px;color:var(--muted);line-height:1.2;margin-top:2px;font-weight:800}

    .headRight{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .selectWrap{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 8px;
      background:#fff;
      border:1px solid var(--stroke);
      border-radius:14px;
      box-shadow:var(--shadow2);
    }
    .selectWrap label{
      font-size:12px;
      color:var(--muted);
      font-weight:900;
      white-space:nowrap;
    }
    select{
      border:1px solid var(--stroke);
      background:#f7f8fa;
      border-radius:12px;
      padding:8px 10px;
      font-family:inherit;
      font-weight:900;
      font-size:13px;
      outline:none;
      cursor:pointer;
      min-width:170px;
    }
    .pill{
      font-size:12px;
      padding:7px 10px;
      border-radius:999px;
      background:#f7f8fa;
      border:1px solid var(--stroke);
      color:var(--muted);
      font-weight:900;
      white-space:nowrap;
    }

    /* ===== Layout ===== */
    main{
      max-width:1100px;
      margin:auto;
      padding:10px 14px 16px;
      display:grid;
      gap:8px; /* مهم: صغير حتى تلتحم الخوارزمية مع مربع خزوم */
    }
    .card{
      background:var(--card);
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    /* ===== Ultra-Compact Khazoom box ===== */
    .buddyCard{
      padding:10px;
    }
    .buddyRow{
      display:flex;
      gap:10px;
      align-items:center;
    }
    .buddyAvatar{
      width:46px;height:46px;
      border-radius:14px;
      background:linear-gradient(135deg,#22c55e,#a7f3d0);
      display:grid;place-items:center;
      font-weight:900;
      color:#0b3b1d;
      box-shadow:0 10px 18px rgba(34,197,94,.22);
      flex:0 0 auto;
    }
    .bubble{
      flex:1;
      border:1px solid var(--stroke);
      border-radius:16px;
      background:#fff;
      box-shadow:var(--shadow2);
      padding:10px 12px;
      min-width:0;
    }
    .bubbleTop{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .buddyName{
      font-weight:900;
      font-size:13px;
      color:#0f172a;
    }
    .miniBadges{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .miniTag{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      background:#f7f8fa;
      border:1px solid var(--stroke);
      color:var(--muted);
      font-weight:900;
      white-space:nowrap;
    }

    /* التمرين ظاهر (بدون إخفاء) */
    .trainBox{
      margin-top:8px;
      border:1px solid var(--stroke);
      border-radius:14px;
      background:#fbfbfc;
      padding:8px 10px;
    }
    .trainLabel{
      font-size:12px;
      color:var(--muted);
      font-weight:900;
      margin-bottom:6px;
    }
    .trainText{
      font-weight:900;
      line-height:1.6;
      font-size:13px;
      white-space:pre-line;
      /* إذا طال التمرين: سكرول داخل نفس الصندوق بدل أخذ الشاشة */
      max-height:64px;
      overflow:auto;
    }

    /* تعليق خزوم سطر/سطرين فقط */
    .chatLine{
      margin-top:8px;
      border:1px solid var(--stroke);
      border-radius:14px;
      background:#fff;
      padding:8px 10px;
      font-weight:900;
      font-size:13px;
      line-height:1.55;
      white-space:pre-line;
      max-height:52px;
      overflow:auto;
    }

    /* زر إظهار/إخفاء التفاصيل (اختياري) */
    .toggleRow{
      margin-top:8px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-start;
    }
    .btn{
      border:1px solid var(--stroke);
      background:#f7f8fa;
      border-radius:12px;
      padding:8px 10px;
      font-weight:900;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
    }
    .btn.primary{
      background: linear-gradient(180deg, #2ee47a, var(--green));
      border-color: rgba(34,197,94,.75);
      color:#0b3b1d;
      box-shadow: 0 10px 20px rgba(34,197,94,.18);
    }
    .btn.ghost{ background:#fff; }

    /* نتيجة مختصرة جداً (حتى لا تسرق مساحة) */
    .resultTiny{
      margin-top:8px;
      border:2px solid var(--stroke);
      border-radius:14px;
      padding:8px 10px;
      background:#fff;
      font-weight:900;
      font-size:13px;
      line-height:1.55;
      white-space:pre-line;
      max-height:48px;
      overflow:auto;
    }

    /* ===== Algorithm card directly below ===== */
    .algoTools{
      padding:10px 12px;
      border-bottom:1px solid var(--stroke);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      background:#fff;
    }
    .algoMeta{
      color:var(--muted);
      font-size:12px;
      font-weight:900;
      white-space:pre-line;
    }
    .hud{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .hud button{
      border:1px solid var(--stroke);
      background:#f7f8fa;
      border-radius:12px;
      padding:8px 10px;
      font-weight:900;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
    }

    .boardWrap{ padding:8px; }
    .board{
      border:1px solid var(--stroke);
      border-radius:16px;
      background:#fff;
      box-shadow:var(--shadow2);
      height:78vh;          /* الخوارزمية تأخذ أغلب الشاشة */
      min-height:560px;
      overflow:hidden;
    }
    svg{width:100%;height:100%;display:block}

    /* الرسم */
    .edge{
      stroke: rgba(29,78,216,.40);
      stroke-width: 2.6;
      fill:none;
      marker-end:url(#arrow);
    }
    .edge.path{
      stroke: var(--green);
      stroke-width: 4.2;
    }
    .edgeLabel{
      fill: rgba(29,78,216,.85);
      font-size: 14px;
      font-weight: 900;
      pointer-events:none;
    }

    .node rect{ fill:#fff3b0; stroke: rgba(29,78,216,.95); stroke-width:3.2; rx:14; }
    .node polygon{ fill:#e0ecff; stroke: rgba(29,78,216,.95); stroke-width:3.2; }
    .node .t{ fill: var(--text); font-size:20px; font-weight:900; }
    .node .ts{ fill: #2f3a4d; font-size:16px; font-weight:800; }

    .node.result.active rect{
      stroke: var(--green);
      stroke-width: 6;
      filter: drop-shadow(0 0 18px rgba(34,197,94,.60));
    }
    .node.result.done rect{
      stroke: rgba(34,197,94,.70);
      stroke-width: 4;
      filter: drop-shadow(0 0 8px rgba(34,197,94,.18));
    }

    .inBtn rect{ rx:11; stroke-width:2.4; }
    .inBtn text{ font-size:14px; font-weight:900; dominant-baseline:middle; text-anchor:middle; fill: var(--text); }
    .inBtn.yes rect{ fill:#ecfdf5; stroke: rgba(34,197,94,.95); }
    .inBtn.no  rect{ fill:#fef2f2; stroke: rgba(239,68,68,.90); }
    .inBtn{ cursor:pointer; }
    .inBtn:hover{ filter: drop-shadow(0 0 12px rgba(0,0,0,.10)); }
    .inBtn.disabled{ opacity:.35; pointer-events:none; filter:none !important; }

    /* ===== Responsive ===== */
    @media (max-width: 720px){
      main{ padding:8px 12px 14px; gap:8px; }
      .pill{ display:none; } /* لتخفيف زحمة الهيدر */
      select{ min-width:150px; }
      .node .t{ font-size:18px; }
      .node .ts{ font-size:15px; }
      .board{ height:82vh; min-height:560px; }
      .trainText{ max-height:72px; }
      .chatLine{ max-height:54px; }
    }
    /* تنظيف: إخفاء العنوان/الشرح المتكرر فوق الخوارزمية مع إبقاء أزرار التكبير/التوسيط */
    .algoMeta{ display:none; }

  
    /* ===== تنظيف نهائي (أسلوب دوولينجو) ===== */
    /* إزالة الوسوم العلوية داخل خزوم */
    .miniBadges, .miniTag{ display:none !important; }

    /* إخفاء أيقونة خزوم الجانبية لتقليل التشتيت */
    .buddyAvatar{ display:none !important; }

    /* إخفاء أزرار التكبير/التصغير/التوسيط (الزوم تلقائي) */
    .hud{ display:none !important; }

    /* إلصاق الخوارزمية مباشرة تحت خزوم */
    main{ gap:6px !important; }
    .boardWrap{ padding-top:6px !important; }

    /* خزوم يظهر عند الحاجة فقط */
    .chatLine{ display:none; }
    .resultTiny{ display:none; }


    /* ===== فقاعة خزوم داخل مساحة الخوارزمية (Duolingo-style) ===== */
    .board{ position:relative; }

    /* شريط أزرار صغير بدل الصندوق الكبير */
    .fabBar{
      position:absolute;
      top:10px;
      right:10px;
      z-index:40;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      pointer-events:auto;
    }
    .fabBtn{
      border:1px solid var(--stroke);
      background:#fff;
      border-radius:999px;
      padding:8px 12px;
      font-weight:900;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
      box-shadow:var(--shadow2);
      white-space:nowrap;
    }
    .fabBtn.primary{
      background: linear-gradient(180deg, #2ee47a, var(--green));
      border-color: rgba(34,197,94,.75);
      color:#0b3b1d;
      box-shadow: 0 10px 20px rgba(34,197,94,.18);
    }

    /* فقاعة خزوم الأساسية (تتحرك مع العقدة الحالية) */
    .khBubble{
      position:absolute;
      top:72px;
      left:10px; /* سيُعدّل بالـJS */
      width:min(520px, calc(100% - 20px));
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(6px);
      border:1px solid var(--stroke);
      border-radius:18px;
      box-shadow:var(--shadow2);
      padding:10px 12px;
      z-index:35;
      pointer-events:auto;
      transition: top 220ms ease-out, left 220ms ease-out;
    }
    .khBubble:after{
      content:"";
      position:absolute;
      bottom:-10px;
      right:36px;
      width:18px;
      height:18px;
      background: rgba(255,255,255,0.96);
      border-right:1px solid var(--stroke);
      border-bottom:1px solid var(--stroke);
      transform: rotate(45deg);
      border-bottom-right-radius:4px;
    }
    .khTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:8px;
    }
    .khName{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      color:#0f172a;
      font-size:14px;
    }
    .khBadge{
      width:34px;height:34px;
      border-radius:12px;
      background:linear-gradient(135deg,#22c55e,#a7f3d0);
      display:grid;place-items:center;
      font-weight:900;
      color:#0b3b1d;
      box-shadow:0 10px 18px rgba(34,197,94,.20);
      flex:0 0 auto;
    }
    .khPill{
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      background:#f7f8fa;
      border:1px solid var(--stroke);
      color:var(--muted);
      font-weight:900;
      white-space:nowrap;
    }
    .khTrain{
      border:1px solid var(--stroke);
      border-radius:14px;
      background:#fbfbfc;
      padding:8px 10px;
    }
    .khTrain .lbl{
      font-size:12px;
      color:var(--muted);
      font-weight:900;
      margin-bottom:6px;
    }
    .khTrain .txt{
      font-weight:900;
      line-height:1.6;
      font-size:13px;
      white-space:pre-line;
      max-height:110px;
      overflow:auto;
    }
    .khLine{
      margin-top:8px;
      border:1px solid var(--stroke);
      border-radius:14px;
      background:#fff;
      padding:8px 10px;
      font-weight:900;
      font-size:13px;
      line-height:1.55;
      white-space:pre-line;
      display:none;
    }

    /* فقاعة إجابة الطالب تظهر قرب زر (نعم/لا) داخل المعين */
    .ansBubble{
      position:absolute;
      z-index:50;
      background:#0f172a;
      color:#fff;
      border-radius:14px;
      padding:8px 10px;
      font-weight:900;
      font-size:13px;
      line-height:1.4;
      box-shadow: 0 12px 24px rgba(0,0,0,.18);
      display:none;
      max-width:min(420px, calc(100% - 20px));
    }
    .ansBubble.good{ background:#065f46; }
    .ansBubble.bad{ background:#7f1d1d; }
    .ansBubble .hint{
      margin-top:6px;
      padding-top:6px;
      border-top:1px solid rgba(255,255,255,.20);
      font-weight:800;
      opacity:.95;
    }

    /* اترك مساحة بصرية فوق الرسم بدون دفعه خارج الشاشة */
    #viewport{ transform-origin: 0 0; }


    /* ===== أزرار الهيدر (مكان الدائرة الصفراء) ===== */
    .headRight{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:flex-start; }
    .headerControls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .topBtn{
      border:1px solid var(--stroke);
      background:#fff;
      border-radius:999px;
      padding:10px 14px;
      font-weight:900;
      cursor:pointer;
      font-family:inherit;
      font-size:13px;
      box-shadow:var(--shadow2);
      white-space:nowrap;
    }
    .topBtn.primary{
      background: linear-gradient(180deg, #2ee47a, var(--green));
      border-color: rgba(34,197,94,.75);
      color:#0b3b1d;
      box-shadow: 0 10px 20px rgba(34,197,94,.18);
    }

    /* فقاعة الإجابة: سطر خزوم المرح */
    .ansBubble .coach{ margin-top:6px; font-weight:800; opacity:.98; }


</style>
</head>

<body>
<header>
  <div class="head">
    <div class="brand">
      <div class="logo">خ</div>
      <div class="brandTitle">
        <b>الدليل الخوارزمي التفاعلي</b>
        <span>خزوم يعطيك تمرين وأنت تجاوب بنعم/لا داخل الخوارزمية خطوة خطوة</span>
      </div>
    </div>

    <div class="headRight">
      <div class="selectWrap">
        <label for="topicSelect">الموضوع</label>
        <select id="topicSelect" aria-label="اختيار الموضوع">
          <option value="first">الكلمة الأولى</option>
          <option value="past">الفعل الماضي</option>
          <option value="amr">فعل الأمر</option>
          <option value="mudari">الفعل المضارع</option>
        </select>
      </div>

      <div class="headerControls">
        <button class="topBtn primary" id="newTrainBtn">تدريب جديد</button>
        <button class="topBtn" id="hintBtn">تلميح</button>
        <button class="topBtn" id="muteBtn">🔇 كتم</button>
      </div>
</div>
  </div>
</header>

<main>
<!-- الخوارزمية تحت مربع خزوم مباشرة وبأكبر مساحة -->
  <section class="card">
    <div class="algoTools">
      <div class="algoMeta">
        <span id="topicTitle">—</span>
        <span> • </span>
        <span id="topicSub">—</span>
      </div>
      <div class="hud">
        <button id="zoomIn">تكبير +</button>
        <button id="zoomOut">تصغير −</button>
        <button id="fitBtn">توسيط</button>
      </div>
    </div>

    <div class="boardWrap">
      <div class="board">

      <div class="ansBubble" id="ansBubble"></div>

        <svg id="svg">
          <defs>
            <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
              <path d="M0,0 L7,3.5 L0,7 Z" fill="rgba(29,78,216,.75)"></path>
            </marker>
          </defs>
          <g id="viewport"></g>
        </svg>
      </div>
    </div>
  </section>

</main>

<script>
/* ========= أدوات هندسية ========= */
function diamondPoints(x,y,w,h){
  const cx=x+w/2, cy=y+h/2;
  return `${cx},${y} ${x+w},${cy} ${cx},${y+h} ${x},${cy}`;
}
function centerTop(n){ return {x:n.x+n.w/2, y:n.y}; }
function centerBottom(n){ return {x:n.x+n.w/2, y:n.y+n.h}; }
function makePath(a,b){
  const midY=(a.y+b.y)/2;
  return `M ${a.x} ${a.y} L ${a.x} ${midY} L ${b.x} ${midY} L ${b.x} ${b.y}`;
}
function midpoint(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
function randInt(n){ return Math.floor(Math.random()*n); }

/* ========= بيانات الخوارزميات ========= */
const TOPICS = {
  first: {
    id:"first",
    name:"خوارزمية إعراب الكلمة الأولى في الجملة",
    sub:"جاوب (نعم/لا) داخل المعين حتى تصل للنتيجة.",
    viewBox:[0,0,1100,1320],
    start:"n0",
    nodes:[
      {id:"n0", type:"start", x:360,y:40,  w:380,h:110,  text:["إعراب الكلمة الأولى","في الجملة"]},

      {id:"d1", type:"decision", x:360,y:170, w:380,h:175, text:["هل الكلمة الأولى اسم؟"], choices:["yes","no"]},
      {id:"r_mubtada", type:"result", x:820,y:215, w:260,h:95, text:["مبتدأ"]},

      {id:"d2", type:"decision", x:360,y:410, w:380,h:175, text:["هل الكلمة الأولى فعل؟"], choices:["yes","no"]},

      {id:"d3", type:"decision", x:360,y:655, w:380,h:175, text:["هل الفعل: ماضٍ؟"], choices:["yes","no"]},
      {id:"r_go_past", type:"result", x:250,y:875, w:520,h:115, link:"past", text:["انتقل إلى خوارزمية","إعراب الفعل الماضي"]},

      {id:"d4", type:"decision", x:820,y:655, w:380,h:175, text:["هل الفعل: مضارع؟"], choices:["yes","no"]},
      {id:"r_go_mudari", type:"result", x:780,y:875, w:520,h:115, link:"mudari", text:["انتقل إلى خوارزمية","إعراب الفعل المضارع"]},

      {id:"d5", type:"decision", x:820,y:970, w:380,h:175, text:["هل الفعل: أمر؟"], choices:["yes","no"]},
      {id:"r_go_amr", type:"result", x:780,y:1185, w:520,h:115, link:"amr", text:["انتقل إلى خوارزمية","إعراب فعل الأمر"]},

/* ========= فقاعة إجابة الطالب قرب زر (نعم/لا) ========= */
function vb(){
  const a = (svg.getAttribute('viewBox')||'0 0 100 100').split(/\s+/).map(Number);
  return {x:a[0], y:a[1], w:a[2], h:a[3]};
}
function showAnswerBubble(svgX, svgY, choiceText, ok, hintText, coachLine){
  if(!ansBubbleEl) return;

  const boardEl = document.querySelector('.board');
  const rect = svg.getBoundingClientRect();
  const boardRect = boardEl.getBoundingClientRect();
  const v = vb();

  const rx = (svgX - v.x) / v.w;
  const ry = (svgY - v.y) / v.h;

  const px = rect.left + rx * rect.width;
  const py = rect.top  + ry * rect.height;

  const localX = px - boardRect.left;
  const localY = py - boardRect.top;

  const you = choiceText ? `أنت: ${choiceText}` : '';
  const coach = (!muted && coachLine) ? `<div class="coach">خُزّوم: ${coachLine}</div>` : '';
  const hint = hintText ? `<div class="hint">تلميح: ${hintText}</div>` : '';
  ansBubbleEl.innerHTML = `${you}${coach}${hint}`;
  ansBubbleEl.classList.remove('good','bad');
  ansBubbleEl.classList.add(ok ? 'good' : 'bad');
  ansBubbleEl.style.display = 'block';

  // تموضع بجانب زر الإجابة داخل المعين
  const panelW = ansBubbleEl.offsetWidth || 240;
  const panelH = ansBubbleEl.offsetHeight || 60;
  let left = localX + 14;
  let top  = localY - panelH - 10;

  const pad = 10;
  left = Math.max(pad, Math.min(left, boardRect.width  - panelW - pad));
  top  = Math.max(pad, Math.min(top,  boardRect.height - panelH - pad));

  ansBubbleEl.style.left = left + 'px';
  ansBubbleEl.style.top  = top  + 'px';

  clearTimeout(window.__ansHideTimer);
  window.__ansHideTimer = setTimeout(()=>{ ansBubbleEl.style.display='none'; }, ok ? 1600 : 3200);
}

/* ========= أزرار داخل المعين ========= */
function buildDecisionButtons(node){
  const g = document.createElementNS("http://www.w3.org/2000/svg","g");
  const pad = 12;
  const y = node.y + node.h - 42;
  const btnW = (node.w - pad*3)/2;
  const btnH = 28;

  function makeBtn(choice, idx){
    const bx = node.x + pad + idx*(btnW + pad);
    const by = y;

    const bg = document.createElementNS("http://www.w3.org/2000/svg","g");
    bg.setAttribute("class", "inBtn " + (choice==="yes" ? "yes" : "no"));
    bg.dataset.decision = node.id;

    const r = document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x", bx);
    r.setAttribute("y", by);
    r.setAttribute("width", btnW);
    r.setAttribute("height", btnH);
    bg.appendChild(r);

    const t = document.createElementNS("http://www.w3.org/2000/svg","text");
    t.setAttribute("x", bx + btnW/2);
    t.setAttribute("y", by + btnH/2);
    t.textContent = (choice==="yes") ? "نعم" : "لا";
    bg.appendChild(t);

    bg.addEventListener("click", (ev)=>{
      ev.stopPropagation();
      handleChoice(node.id, choice, {x: bx + btnW/2, y: by + btnH/2});
    });

    g.appendChild(bg);
  }

  makeBtn("yes", 0);
  makeBtn("no", 1);
  return g;
}

/* ========= رسم المخطط ========= */
function draw(t){
  viewport.innerHTML="";
  const [x,y,w,h]=t.viewBox;
  svg.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);

  t.edges.forEach(e=>{
    const from = t.nodes.find(n=>n.id===e.from);
    const to   = t.nodes.find(n=>n.id===e.to);
    if(!from||!to) return;

    const start = centerBottom(from);
    const end   = centerTop(to);

    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.setAttribute("class","edge");
    p.dataset.edgeKey = `${e.from}->${e.to}`;
    p.setAttribute("d", makePath(start,end));
    viewport.appendChild(p);

    if(e.label){
      const m = midpoint(start,end);
      const tx = document.createElementNS("http://www.w3.org/2000/svg","text");
      tx.setAttribute("class","edgeLabel");
      tx.setAttribute("x", m.x + 10);
      tx.setAttribute("y", m.y - 8);
      tx.textContent = e.label;
      viewport.appendChild(tx);
    }
  });

  t.nodes.forEach(n=>{
    const g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","node " + (n.type==="decision" ? "decision" : "result"));
    g.dataset.id=n.id;

    if(n.type==="decision"){
      const poly=document.createElementNS("http://www.w3.org/2000/svg","polygon");
      poly.setAttribute("points", diamondPoints(n.x,n.y,n.w,n.h));
      g.appendChild(poly);
    } else {
      const rect=document.createElementNS("http://www.w3.org/2000/svg","rect");
      rect.setAttribute("x",n.x); rect.setAttribute("y",n.y);
      rect.setAttribute("width",n.w); rect.setAttribute("height",n.h);
      rect.setAttribute("rx", n.type==="start" ? 18 : 16);
      g.appendChild(rect);
    }

    const lines=n.text||[];
    const cx=n.x+n.w/2, cy=n.y+n.h/2;
    const offset = (n.type==="decision") ? 12 : 0;

    lines.forEach((line,i)=>{
      const tEl=document.createElementNS("http://www.w3.org/2000/svg","text");
      tEl.setAttribute("text-anchor","middle");
      tEl.setAttribute("dominant-baseline","middle");
      tEl.setAttribute("x",cx);
      tEl.setAttribute("y", cy + (i-(lines.length-1)/2)*22 - offset);
      tEl.setAttribute("class", i===0 ? "t":"ts");
      tEl.textContent=line;
      g.appendChild(tEl);
    });

    if(n.type==="decision"){
      g.appendChild(buildDecisionButtons(n));
    }

    if(n.link){
      g.style.cursor="pointer";
      g.addEventListener("click", ()=> switchTopic(n.link, true));
    }

    viewport.appendChild(g);
  });

  refresh();
}


/* ========= تحديث نص عقدة (لعرض التدريب داخل المربع الأزرق) ========= */
function setNodeText(nodeId, lines){
  const n = topic.nodes.find(x=>x.id===nodeId);
  if(!n) return;
  n.text = lines;

  const g = viewport.querySelector(`.node[data-id="${nodeId}"]`);
  if(!g) return;

  // احذف النصوص القديمة
  [...g.querySelectorAll('text')].forEach(t=>t.remove());

  const cx=n.x+n.w/2, cy=n.y+n.h/2;
  const offset = (n.type==='decision') ? 12 : 0;
  (lines||[]).forEach((line,i)=>{
    const tEl=document.createElementNS('http://www.w3.org/2000/svg','text');
    tEl.setAttribute('text-anchor','middle');
    tEl.setAttribute('dominant-baseline','middle');
    tEl.setAttribute('x',cx);
    tEl.setAttribute('y', cy + (i-((lines.length-1)/2))*22 - offset);
    tEl.setAttribute('class', i===0 ? 't' : 'ts');
    tEl.textContent=line;
    g.appendChild(tEl);
  });
}

function nodeCenter(id){
  const n = topic.nodes.find(x=>x.id===id);
  if(!n) return {x:base.x+base.w/2, y:base.y+60};
  return {x:n.x+n.w/2, y:n.y+n.h/2};
}

/* ========= تحديث المسار + تعطيل أزرار غير العقدة الحالية ========= */
function refresh(){
  viewport.querySelectorAll(".node").forEach(g=>{
    const id=g.dataset.id;
    g.classList.remove("active","done");
    if(visitedNodes.has(id)) g.classList.add("done");
    if(finalResultId===id) g.classList.add("active");
  });

  viewport.querySelectorAll(".edge").forEach(p=>{
    p.classList.toggle("path", visitedEdges.has(p.dataset.edgeKey));
  });

  viewport.querySelectorAll(".inBtn").forEach(b=>{
    b.classList.toggle("disabled", b.dataset.decision !== currentNodeId);
  });
}

/* ========= انتقال ========= */
function gotoNode(id){
  visitedNodes.add(id);
  steps++;

  const n = topic.nodes.find(x=>x.id===id);
  if(!n){ refresh(); return; }

  if(n.type==="decision"){
    currentNodeId = id;
    refresh();

    // لا نكرر نص السؤال هنا لأنه ظاهر داخل المعين
    // خزوم يكتفي بالتوجيه العام حتى لا تتكرر الجملة على الشاشة
    say("جاوب من داخل المعين.", false);

    zoomToNode(id, true);
    movePanelToNode(id);
  } else {
    finalResultId=id;
    currentNodeId=null;
    refresh();

    const endText=(n.text||[]).join(" — ");
    setResult("النتيجة: " + endText, "ok", true);
    say("تم.", true);

    zoomToNode(id, true);
  }
}

/* ========= التحقق (مع متابعة خزوم) ========= */
function handleChoice(decisionId, choice, anchor){
  if(decisionId !== currentNodeId) return;

  // أظهر اختيار الطالب فوراً داخل الخوارزمية قرب زر الإجابة
  const choiceText = (choice==="yes") ? "نعم" : "لا";

  // تحقق مقابل التدريب الحالي: يوجّه الطالب خطوة بخطوة
  let expected = null;
  if(currentTrain && currentTrain.expected) expected = currentTrain.expected[decisionId] || null;

  if(expected && expected !== choice){
    const msg = BAD_LINES[randInt(BAD_LINES.length)];
    const h = (currentTrain.goalHint || hintFor(decisionId));
    say(`${msg}
تلميح: ${h}`, true);
    if(anchor) showAnswerBubble(anchor.x, anchor.y, choiceText, false, h, msg);
    zoomToNode(decisionId, true, 1.25);
    return;
  }

  const okLine = OK_LINES[randInt(OK_LINES.length)];
  if(anchor) showAnswerBubble(anchor.x, anchor.y, choiceText, true, '', okLine);

  const d = topic.logic?.decisions?.[decisionId];
  if(!d) return;
  const next = d[choice];
  if(!next) return;

  visitedEdges.add(`${decisionId}->${next}`);
  gotoNode(next);
}

/* ========= تشغيل/إعادة ========= */
function resetRun(){
  visitedNodes=new Set();
  visitedEdges=new Set();
  steps=0;
  currentNodeId=null;
  finalResultId=null;

  setResult("النتيجة ستظهر هنا.", null);

  visitedNodes.add(topic.start);
  steps++;

  const first = topic.edges.find(e=>e.from===topic.start);
  if(first){
    visitedEdges.add(`${first.from}->${first.to}`);
    gotoNode(first.to);
  } else {
    currentNodeId = topic.start;
    refresh();
  }
}

/* ========= كاميرا + زوم ========= */
let base={x:0,y:0,w:1100,h:1200};
let cam={x:0,y:0,k:1};

function setViewBox(){
  const w=base.w/cam.k, h=base.h/cam.k;
  svg.setAttribute("viewBox", `${cam.x} ${cam.y} ${w} ${h}`);

  // مزامنة موضع اللوحة أثناء الزوم/التحريك
  if(window.__panelSync) return;
  window.__panelSync = requestAnimationFrame(()=>{
    window.__panelSync = null;
    movePanelToNode(currentNodeId || finalResultId);
  });
}
function fit(){ cam.k=1; cam.x=base.x; cam.y=base.y; setViewBox(); }
function zoom(f){ cam.k = Math.min(3.0, Math.max(0.85, cam.k * f)); setViewBox(); }

function zoomToNode(nodeId, animate=true, targetK=null){
  const n = topic.nodes.find(x=>x.id===nodeId);
  if(!n) return;

  const cx = n.x + n.w/2;
  const cy = n.y + n.h/2;

  const desiredK = targetK || Math.min(2.4, Math.max(1.25, cam.k*1.10));
  const viewW = base.w / desiredK;
  const viewH = base.h / desiredK;

  const tx = cx - viewW/2;
  const ty = cy - viewH/2;

  if(!animate){
    cam.k = desiredK; cam.x = tx; cam.y = ty; setViewBox();
    return;
  }

  const start = {x:cam.x, y:cam.y, k:cam.k};
  const end = {x:tx, y:ty, k:desiredK};
  const t0 = performance.now();
  const dur = 220;

  function easeOut(t){ return 1 - Math.pow(1-t, 3); }

  function step(now){
    const p = Math.min(1, (now - t0) / dur);
    const e = easeOut(p);
    cam.x = start.x + (end.x - start.x)*e;
    cam.y = start.y + (end.y - start.y)*e;
    cam.k = start.k + (end.k - start.k)*e;
    setViewBox();
    if(p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}


/* ========= تحريك لوحة خزوم داخل الخوارزمية مع التقدم ========= */
function getViewBox(){
  const vb = (svg.getAttribute("viewBox")||"0 0 100 100").split(/\s+/).map(Number);
  return {x:vb[0], y:vb[1], w:vb[2], h:vb[3]};
}

function movePanelToNode(nodeId){
  // تم حذف لوحة الحوار الكبيرة (المحددة بالأحمر)
  return;
}


/* HUD */
document.getElementById("zoomIn").onclick=()=>zoom(1.2);
document.getElementById("zoomOut").onclick=()=>zoom(1/1.2);
document.getElementById("fitBtn").onclick=()=>fit();


/* ========= تدريب جديد (يُظهر جملة التدريب بوضوح) ========= */
function pickTraining(){
  const arr = TRAIN[topic.id] || [];
  if(arr.length === 0) return null;
  return arr[randInt(arr.length)];
}
function startTraining(){
  currentTrain = pickTraining();
  if(!currentTrain){
    setNodeText(topic.start, ["لا توجد تدريبات لهذا الموضوع حالياً.", "اختر موضوعاً آخر أو أضف تدريبات."]);
    say("لا يوجد تمرين هنا حالياً.");
    setResult("—", null);
    return;
  }

  // عرض التدريب داخل المربع الأزرق (عقدة البداية)
  const parts = (currentTrain.prompt||'').split(/\n+/);
  const l1 = parts[0] ? parts[0].trim() : 'التدريب';
  const l2 = parts[1] ? parts[1].trim() : 'جاوب من داخل المعين.';
  setNodeText(topic.start, [l1, l2]);

  setResult("", null);
  say("ابدأ.", false);
  say("جاهز.", false);

  fit();
  resetRun();
  setTimeout(()=>movePanelToNode(currentNodeId||finalResultId), 80);
}
newTrainBtn.addEventListener("click", startTraining);

/* ========= تلميح ========= */
hintBtn.addEventListener('click', ()=>{
  if(!currentNodeId){
    // لو انتهى: اعرض تلميح عام داخل المربع الأزرق
    const c = nodeCenter(topic.start);
    showAnswerBubble(c.x, c.y, 'تلميح', true, 'ابدأ بتحديد: اسم/فعل/حرف.', 'جاهز لجولة جديدة؟');
    return;
  }
  const h = hintFor(currentNodeId);
  const c = nodeCenter(currentNodeId);
  showAnswerBubble(c.x, c.y, 'تلميح', true, h, 'خُذها خطوة خطوة.');
});

/* ========= كتم ========= */
muteBtn.addEventListener("click", ()=>{
  muted = !muted;
  muteBtn.textContent = muted ? "🔊 تشغيل" : "🔇 كتم";
  if(!muted) say("تم.", false);
});


/* ========= تبديل الموضوع ========= */
function applyTopicUI(){
  topicTitle.textContent = topic.name;
  topicSub.textContent = topic.sub;

  const ORIGINAL_START = {
    first: ['إعراب الكلمة الأولى','في الجملة'],
    past:  ['إعراب الفعل الماضي'],
    amr:   ['إعراب فعل الأمر'],
    mudari:['إعراب الفعل المضارع']
  };
  setNodeText(topic.start, ORIGINAL_START[topic.id] || ['ابدأ من هنا']);
}

function switchTopic(id, autoStart=false){
  topic = TOPICS[id] || TOPICS.first;
  topicSelect.value = topic.id;

  const [x,y,w,h]=topic.viewBox;
  base={x,y,w,h}; cam={x,y,k:1};

  applyTopicUI();
  draw(topic);
  fit();

  currentTrain = null;
  resetRun();
  setTimeout(()=>movePanelToNode(currentNodeId||finalResultId), 80);

  if(autoStart) startTraining();
}

topicSelect.addEventListener("change", (e)=> switchTopic(e.target.value, false));

/* تشغيل أولي */
switchTopic("first", false);
