name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated checks
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

  live-supabase:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Verify live Supabase schema and RLS
        run: npm run verify:supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Run live two-session progress test
        run: npm run test:integration
        env:
          INTEGRATION_BASE_URL: ${{ secrets.INTEGRATION_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_INTEGRATION_EMAIL: ${{ secrets.SUPABASE_INTEGRATION_EMAIL }}
          SUPABASE_INTEGRATION_PASSWORD: ${{ secrets.SUPABASE_INTEGRATION_PASSWORD }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live authenticated completion journey
        run: npm run test:e2e -- e2e/authenticated-flow.spec.ts --project=desktop-chromium --workers=1
        env:
          RUN_AUTHENTICATED_E2E: "1"
          E2E_BASE_URL: ${{ secrets.INTEGRATION_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_INTEGRATION_EMAIL: ${{ secrets.SUPABASE_INTEGRATION_EMAIL }}
          SUPABASE_INTEGRATION_PASSWORD: ${{ secrets.SUPABASE_INTEGRATION_PASSWORD }}
