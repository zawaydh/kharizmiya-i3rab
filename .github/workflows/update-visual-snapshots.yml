name: Update visual snapshots

on:
  push:
    paths:
      - ".github/workflows/update-visual-snapshots.yml"

jobs:
  snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Linux snapshots
        run: npx playwright test e2e/visual-regression.spec.ts --update-snapshots

      - name: Upload Linux snapshots
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots-linux
          path: e2e/visual-regression.spec.ts-snapshots/*-linux.png
